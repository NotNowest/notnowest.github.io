<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portfólio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="titulo">NOTNOWEST</h1>
    <p class="subtitle">beats • visuals • atmosphere</p>
    
    <div class="linha"></div>
    
    <div class="galeria">
        <div class="item">
            <a class="factspost" href="https://soundcloud.com/not-nowest/facts" target="_blank" rel="noopener noreferrer">
                <img src="galeria/facts1.jpg" alt="facts">
                <p>FACTS</p>
            </a>
        </div>

        <div class="item">
            <a class="curvepost" href="https://soundcloud.com/not-nowest/curve" target="_blank" rel="noopener noreferrer">
                <img src="galeria/curve.jpg" alt="curve">
                <p>CURVE</p>
            </a>
        </div>
        
        <div class="item">
            <a class="seenspost" href="https://soundcloud.com/not-nowest/seen" target="_blank" rel="noopener noreferrer">
                <img src="galeria/seen1.jpg" alt="seen">
                <p>SEEN</p>
            </a> 
        </div> 
    </div>
    
    <div class="linha"></div>
    
    <div class="mp4player">
        <p class="video-title">LATEST VISUAL</p>
        <div class="video-box">
            <video controls>
                <source src="galeria/seeeen.mp4" type="video/mp4">
            </video>
        </div> 

        <div class="buttons">
            <a href="https://www.tiktok.com/@notnowest/video/7597232225532398869" target="_blank" class="btn tiktok">▶ TikTok</a>
            <a href="https://www.youtube.com/shorts/tSBxprAz-74" target="_blank" class="btn yt">▶ YouTube</a>
        </div>
    </div> <div class="linha"></div>

    <p class="textb">all the beats are available on SoundCloud and Youtube</p>

    <div class="spng">
        <img src="galeria/scld.png" alt="soundpng">
        <img src="galeria/youtube.png" alt="ytyt">
    </div>   
         
</body>
</html>
